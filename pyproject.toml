[project]
name = "scheduler-kernel"
version = "0.1.0"
description = "Phase 0 schedule kernel: generate, explain, and locally repair school timetables."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ortools>=9.14,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
scheduler-kernel = "scheduler_kernel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

